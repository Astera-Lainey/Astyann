spring.application.name=AIOrchestrator

server.port=8090

# ── Ollama (local model) ─────────────────────────────────────────────────────
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.chat.options.num-predict=4096

# ── Downstream service URLs (stubs) ─────────────────────────────────────────
services.rag.url=http://localhost:8091
services.metamodel.url=http://localhost:8092

# ── File upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ── Logging ─────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.afb.astyann.aiorchestrator=DEBUG
logging.level.org.springframework.ai=DEBUG
