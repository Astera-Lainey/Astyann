spring.application.name=CodeGeneration
server.port=8086

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/astyann_code?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File storage
app.upload-dir=uploads/code

# Downstream service URLs
services.requirement.url=http://localhost:8083
services.document.url=http://localhost:8085
services.version.url=http://localhost:8087
services.ai-orchestrator.url=http://localhost:8089
services.rag.url=http://localhost:8090

# Feign timeouts (unbounded, matches sibling generation services)
spring.cloud.openfeign.client.config.default.connect-timeout=0
spring.cloud.openfeign.client.config.default.read-timeout=0

# ── AI logic injection ──────────────────────────────────────────────
# Model to use when asking the AI Orchestrator to implement stub methods
# and to fix compilation errors during validate().
codegen.ai.model=minimax-m3:cloud
codegen.ai.rag.top-k=5

# Turn the AI logic-injection pass on/off. When false, /generate emits
# stub methods only (UnsupportedOperationException); when true, each
# module is sent to the AI Orchestrator during generation.
codegen.ai.logic-injection.enabled=true

# Turn the compile self-correction loop on/off inside /validate. Requires a
# working Maven install (see mvn-command below). When false, validate() falls
# back to a deterministic archive-present check.
codegen.validate.compile.enabled=true
codegen.validate.compile.max-attempts=5
# Optional override — the mvn executable to invoke. When blank, MavenRunner
# tries OS-aware candidates:
#   Windows: mvn.cmd, mvn.bat, mvn (in that order)
#   Linux/macOS: mvn
# It also picks up a project-local ./mvnw.cmd or ./mvnw wrapper if present.
# Set this to an absolute path only if the auto-detection can't find your
# install, e.g. C:\\tools\\apache-maven-3.9.9\\bin\\mvn.cmd
codegen.validate.compile.mvn-command=

# When true, /generate runs /validate automatically after the backend layer
# finishes (compile + AI fix loop). Off by default because it adds ~30-60s
# per project and requires `mvn` on PATH.
codegen.generate.auto-validate=false

logging.level.root=INFO
logging.level.afb.astyann.codegeneration=DEBUG
