<div class="new-project">
  <app-sparkle-icon class="spark spark--a" [size]="24" />
  <app-sparkle-icon class="spark spark--b" [size]="20" />
  <app-sparkle-icon class="spark spark--c" [size]="22" />
  <app-sparkle-icon class="spark spark--d" [size]="18" />

  <div class="new-project__eyebrow">Step 1 · Brief</div>
  <h1 class="new-project__title">Tell me about your project</h1>
  <p class="new-project__subtitle">Share an idea and upload a specification document.</p>

  <form class="new-project__form" [formGroup]="briefForm" (ngSubmit)="onSubmitBrief()" novalidate>
    <app-form-field label="Project name" [errorMessage]="titleError">
      <input type="text" formControlName="title" placeholder="e.g. Orbit CRM" />
    </app-form-field>

    <app-form-field label="Describe your idea" [errorMessage]="descriptionError">
      <textarea formControlName="description" rows="3" placeholder="A CRM tailored for boutique agencies…"></textarea>
    </app-form-field>

    <div class="new-project__field">
      <div class="new-project__field-header">
        <span class="new-project__field-label">Specification document</span>
        <button
          type="button"
          class="new-project__download-template"
          (click)="downloadTemplate()"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          Download specification template
        </button>
      </div>
      @if (!selectedFile()) {
        <label class="new-project__dropzone">
          <input type="file" accept=".pdf,.docx" (change)="onFileSelected($event)" hidden />
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          <div class="new-project__dropzone-text">Click to choose a PDF or Word document</div>
          <div class="new-project__dropzone-hint">Max 20MB</div>
        </label>
      } @else {
        <div class="new-project__file-row">
          <div class="new-project__file-info">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" />
            </svg>
            {{ selectedFile()!.name }}
          </div>
          <button type="button" class="new-project__file-remove" (click)="removeFile()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
      }
      @if (fileError()) {
        <span class="new-project__field-error">{{ fileError() }}</span>
      }
    </div>

    @if (errorMessage()) {
      <p class="new-project__server-error" role="alert">{{ errorMessage() }}</p>
    }

    <div class="new-project__actions">
      <button type="submit" class="new-project__submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Analyzing…' : 'Continue to requirements' }}
      </button>
    </div>
  </form>
</div>
