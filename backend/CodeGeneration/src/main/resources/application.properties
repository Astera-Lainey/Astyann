spring.application.name=CodeGeneration
server.port=8086

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/astyann_code?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File storage
app.upload-dir=uploads/code

# Downstream service URLs
services.requirement.url=http://localhost:8083
services.document.url=http://localhost:8085
services.version.url=http://localhost:8087
services.ai-orchestrator.url=http://localhost:8089
services.rag.url=http://localhost:8090

# Feign timeouts (unbounded, matches sibling generation services)
spring.cloud.openfeign.client.config.default.connect-timeout=0
spring.cloud.openfeign.client.config.default.read-timeout=0

# ── AI logic injection ──────────────────────────────────────────────
# Model to use when asking the AI Orchestrator to implement stub methods
# and to fix compilation errors during validate().
# gpt-oss:120b-cloud — a code-focused, instruction-following cloud model on Ollama's free tier.
# Chosen over the previous reasoning model (minimax-m3:cloud), which spent its token budget
# "thinking" and returned empty output for complex modules. Requires an Ollama account signed in
# for cloud models (same as before). Drop to gpt-oss:20b-cloud to stretch the free quota further.
codegen.ai.model=gpt-oss:120b-cloud
codegen.ai.rag.top-k=5
# Read timeout (seconds) for a single AI Orchestrator inference call. Generous because model
# generation can take a minute or more; 0 disables the read timeout entirely.
codegen.ai.read-timeout-seconds=300

# Turn the AI logic-injection pass on/off. When false, /generate emits
# stub methods only (UnsupportedOperationException); when true, each
# module is sent to the AI Orchestrator during generation.
codegen.ai.logic-injection.enabled=true
# Modules are implemented in parallel. Bound the fan-out so a large PCSF does
# not flood the AI Orchestrator with concurrent requests.
codegen.ai.logic-injection.concurrency=3
# Per-module retry budget when the AI returns an empty or unparseable reply
# (some models occasionally return blank content). 1 = no retry.
codegen.ai.logic-injection.max-attempts=2
# Ask the AI for a JUnit business-rule test per module (writes to src/test/java).
# OFF by default: these tests are written by the same model that wrote the code, so a wrong
# implementation can come with a test that agrees with it, and a flawed test turns
# test:BACKEND red for the wrong reason. The deterministic tests below always run.
codegen.ai.logic-injection.generate-tests=false

# Turn the compile self-correction loop on/off inside /validate. Requires a
# working Maven install (see mvn-command below). When false, validate() falls
# back to a deterministic archive-present check.
codegen.validate.compile.enabled=true
codegen.validate.compile.max-attempts=5

# Run the generated backend test suite (`mvn test`) after compilation succeeds. These are
# deterministic tests rendered from the projection — a context-load smoke test, JPA slice tests
# per entity and web slice tests per controller — executed against in-memory H2. Report-only:
# failures are surfaced, never auto-"fixed", because a model told to fix a failing test tends to
# weaken the assertion instead of the code.
codegen.validate.test.enabled=true
# Optional override — the mvn executable to invoke. When blank, MavenRunner
# tries OS-aware candidates:
#   Windows: mvn.cmd, mvn.bat, mvn (in that order)
#   Linux/macOS: mvn
# It also picks up a project-local ./mvnw.cmd or ./mvnw wrapper if present.
# Set this to an absolute path only if the auto-detection can't find your
# install, e.g. C:\\tools\\apache-maven-3.9.9\\bin\\mvn.cmd
codegen.validate.compile.mvn-command=

# When true, /generate runs /validate automatically after the backend layer
# finishes (compile + AI fix loop). Off by default because it adds ~30-60s
# per project and requires `mvn` on PATH.
codegen.generate.auto-validate=false

# Frontend build + AI-fix loop inside /validate (mirrors the backend). Runs `npm install` then
# `ng build --configuration development` — the real Angular compiler, so component templates are
# checked too (plain `tsc` never sees them). Needs Node.js on PATH; set false to skip.
codegen.validate.frontend.enabled=true
codegen.validate.frontend.max-attempts=3
# Optional override for the npm executable (absolute path). Blank = OS-aware
# candidates: npm.cmd/npm.bat/npm on Windows, npm on Linux/macOS.
codegen.validate.frontend.npm-command=

# Approval gate: block /approve while a BACKEND layer still has un-implemented
# stub methods (they compile but throw at runtime). Set false to override.
codegen.approve.require-complete=true

logging.level.root=INFO
logging.level.afb.astyann.codegeneration=DEBUG
