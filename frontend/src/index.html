<head>

  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <!--
    The Alata font was injected per-route in React via TanStack Router's
    head().links (see login.tsx / signup.tsx / index.tsx). Angular has no
    direct per-route <link> injection without extra tooling, and Alata is
    used across every auth page plus the landing page, so it's loaded
    globally here instead — functionally equivalent, slightly simpler.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet" />
</head>

</body>
