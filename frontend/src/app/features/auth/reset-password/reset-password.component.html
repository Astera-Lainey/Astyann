<div class="auth-page">
  <app-decorative-circles position="tl" />
  <app-decorative-circles position="bl" />

  <app-sparkle-icon class="spark spark--a" [size]="28" />
  <app-sparkle-icon class="spark spark--b" [size]="22" />
  <app-sparkle-icon class="spark spark--c" [size]="26" />
  <app-sparkle-icon class="spark spark--d" [size]="20" />

  <header class="auth-page__header">
    <a routerLink="/" class="auth-page__brand">Astyann</a>
  </header>

  <main class="auth-page__main">
    <section class="auth-panel">
      @if (!isSubmitted()) {
        <h1 class="auth-panel__title">New Password</h1>
        <p class="auth-panel__subtitle">Choose a new password for your account.</p>

        <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
          <app-form-field label="New password" [errorMessage]="passwordError">
            <input type="password" formControlName="password" placeholder="Enter your new password" autocomplete="new-password" />
          </app-form-field>

          <app-form-field label="Confirm password" [errorMessage]="confirmPasswordError">
            <input type="password" formControlName="confirmPassword" placeholder="Re-enter your new password" autocomplete="new-password" />
          </app-form-field>

          @if (errorMessage()) {
            <p class="auth-form__server-error" role="alert">{{ errorMessage() }}</p>
          }

          <button type="submit" class="auth-form__submit" [disabled]="isSubmitting() || !token()">
            {{ isSubmitting() ? 'Saving…' : 'Reset Password' }}
          </button>
        </form>
      } @else {
        <h1 class="auth-panel__title">Password Updated</h1>
        <p class="auth-panel__subtitle">
          Your password has been changed successfully. You can now sign in with your new password.
        </p>
        <button type="button" class="auth-form__submit auth-form__submit--standalone" (click)="goToLogin()">
          Go to Sign In
        </button>
      }
    </section>

    <section class="auth-visual">
      <div class="auth-visual__frame">
        <img src="/assets/images/login-wave.jpg" alt="Astyann visual" class="auth-visual__image" />
      </div>
    </section>
  </main>
</div>
