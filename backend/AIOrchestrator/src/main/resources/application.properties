spring.application.name=AIOrchestrator

server.port=8089

# Ollama (local model)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5-coder:3b
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.chat.options.num-predict=4096

# Downstream service URLs (stubs)
services.rag.url=http://localhost:8090
services.metamodel.url=http://localhost:8092

# ── File upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ── Timeouts ─────────────────────────────────────────────────────────────────
spring.mvc.async.request-timeout=-1

# ── Logging ─────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.afb.astyann.aiorchestrator=DEBUG
logging.level.org.springframework.ai=DEBUG
