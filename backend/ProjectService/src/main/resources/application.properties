spring.application.name=ProjectService

server.port=8082

# ── Database ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/astyann_projects?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ─────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── Logging ─────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.afb.astyann.projectservice=DEBUG

# ── File upload ──────────────────────────────────────────────────────────────
app.upload-dir=uploads/documents
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ── Downstream service URLs (placeholders — override when services are live) ─
services.ai.url=http://localhost:8089

# ── Feign timeouts ────────────────────────────────────────────────────────────
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=0
spring.cloud.openfeign.client.config.ai-service.read-timeout=0
services.requirements.url=http://localhost:8083
services.document.url=http://localhost:8085
services.uml.url=http://localhost:8084
services.codegen.url=http://localhost:8086
services.deployment.url=http://localhost:8088
