spring.application.name=AIOrchestrator

server.port=8089

# Ollama (local model)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=minimax-m3:cloud
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.chat.options.num-predict=16384
spring.ai.ollama.chat.options.num-ctx=32768

# Effective output-token ceiling for /infer and code generation. The code sets numPredict
# explicitly per call, so THIS is the knob that actually governs inference length (the
# spring.ai.* num-predict above is overridden per request). Raise if complex modules come back
# with empty/truncated output and the log shows finishReason=length.
ai.ollama.num-predict=16384

# Downstream service URLs (stubs)
services.rag.url=http://localhost:8090
services.metamodel.url=http://localhost:8092

# ── File upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ── Timeouts ─────────────────────────────────────────────────────────────────
spring.mvc.async.request-timeout=-1

# ── Logging ─────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.afb.astyann.aiorchestrator=DEBUG
logging.level.org.springframework.ai=DEBUG
